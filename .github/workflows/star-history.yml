name: Update Star History Chart

on:
  push:
    branches: [main]
  schedule:
    # UTC 2:00 / 14:00 每天 (北京 10:00 / 22:00)
    - cron: '0 2 * * *'
    - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      # Star History 后端在 Cloudflare 后；机房出口 + curl 默认 UA 易触发 403，需显式 UA 并规范仓库名为小写（与 API 301 一致）
      - name: Fetch Star History SVG
        run: |
          mkdir -p assets
          CACHEBUST=$(date +%Y%m%d%H%M)
          TEMP_SVG=$(mktemp)
          trap 'rm -f "$TEMP_SVG"' EXIT

          if ! curl -fsSL \
            --retry 5 --retry-delay 8 --retry-all-errors \
            --connect-timeout 15 --max-time 120 \
            -A 'Mozilla/5.0 (compatible; ARKTI-StarHistory-Fetch/1.0; +https://github.com/YBWLawa0/ARKTI)' \
            -H 'Accept: image/svg+xml,*/*' \
            "https://api.star-history.com/svg?repos=ybwlawa0/arkti&type=Date&t=${CACHEBUST}" \
            -o "$TEMP_SVG"; then
            if [ -s assets/star-history.svg ]; then
              echo "::warning::Star History service is temporarily unavailable; keeping the existing chart."
              exit 0
            fi
            echo "::error::Star History download failed and no existing chart is available."
            exit 1
          fi

          if ! grep -q '<svg' "$TEMP_SVG" || grep -qiE 'restricted access to star data|stargazer-api-restriction' "$TEMP_SVG"; then
            if [ -s assets/star-history.svg ] && ! grep -qiE 'restricted access to star data|stargazer-api-restriction' assets/star-history.svg; then
              echo "::warning::Star History returned an error placeholder; keeping the existing chart."
              exit 0
            fi
            echo "::error::Star History returned an invalid SVG or error placeholder."
            exit 1
          fi

          mv "$TEMP_SVG" assets/star-history.svg

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/star-history.svg
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: update star-history chart"
          git push
